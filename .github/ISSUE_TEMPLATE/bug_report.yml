name: Bug report
description: Something in Nixup is broken or does not work as expected.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please [search the existing issues](https://github.com/by-architect/Nixup/issues?q=is%3Aissue) first; if the bug is already reported, add a thumbs up reaction to it instead.

        Keep `[BUG]` at the start of the title and add a short summary after it, for example `[BUG] The ntfy service stops after a restart`. Security problems must be reported privately, as a [security advisory](https://github.com/by-architect/Nixup/security/advisories/new).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add ... to configuration.nix
        2. Press Build
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of Nixup is it about?
      multiple: true
      options:
        - Building the config, generations and rollbacks
        - Apps from F-Droid repositories, developers' releases or Google Play
        - App settings or system settings
        - Nix packages, the terminal, users or Home Manager
        - Services (Tailscale, ssh, ntfy, calendar and contacts sync, your own)
        - Backups and restores
        - The Nixup app (Build, Updates, Services, Backups, Logs)
        - Installing or updating the Magisk module
        - Something else
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: The part of your configuration.nix
      description: The options the bug is about. Please remove passwords, keys and anything private first.
      render: nix
  - type: input
    id: version
    attributes:
      label: Nixup version
      description: Shown in Magisk → Modules, under Nixup.
      placeholder: "0.1.13"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, Android version and root
      placeholder: "Pixel 7, Android 15, Magisk 28.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: The build's output or the Logs tab help a lot. Drag files here, but please remove anything private first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues, and this bug is not reported yet.
          required: true
